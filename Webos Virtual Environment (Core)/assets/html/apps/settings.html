<div id="settings-window" class="aero-utility-window window settings-window" role="application" aria-label="Settings">
 <div class="aero-tool-titlebar"><span class="aero-tool-title-mark">⚙</span><span class="aero-tool-title">Settings <span class="aero-tool-subtitle">ACCOUNT MANAGEMENT</span></span><button id="settings-minimize" type="button" aria-label="Kis méret">_</button><button id="settings-close" type="button" aria-label="Bezárás">×</button></div>
 <div class="settings-body"><aside class="settings-side"><div class="settings-side-title">SETTINGS</div><button class="settings-nav active" type="button">♙　Account Management</button></aside><section class="settings-content"><header class="settings-heading"><div><div class="settings-eyebrow">USER & ACCESS</div><h1>Account Management</h1></div><button id="account-add" class="settings-primary" type="button">＋ Új fiók</button></header><div class="settings-protected"><span class="protected-icon">◆</span><div><strong>ADMIN · Védett rendszerfiók</strong></div><span class="protected-lock">LOCKED</span></div><div class="account-file-panel"><div><strong>login.json · rendszeradatbázis</strong></div><span class="account-system-badge">SYSTEM FILE</span></div><div class="account-list-head"><span>FELHASZNÁLÓI FIÓKOK</span><span id="account-count">0 fiók</span></div><div id="account-list" class="account-list"><div class="aero-tool-empty">Még nincs létrehozott felhasználói fiók.</div></div><div id="account-storage-status" class="account-storage-status" role="status" aria-live="polite">Fióktárhely ellenőrzése…</div></section></div>
 <div id="account-editor" class="account-editor-backdrop" hidden><form id="account-form" class="account-editor"><div class="account-editor-title"><strong id="account-editor-title">Új fiók létrehozása</strong><button type="button" id="account-editor-close" aria-label="Bezárás">×</button></div><label>Felhasználónév<input id="account-username" required minlength="3" maxlength="32" autocomplete="off" spellcheck="false"></label><label>Megjelenő név<input id="account-display" required maxlength="48" autocomplete="off"></label><label>Jelszó<input id="account-password" type="password" minlength="4" autocomplete="new-password"><small id="account-password-hint">Min. 4 karakter. Üresen hagyva változatlan.</small></label><label class="account-active-label"><input id="account-active" type="checkbox" checked> Fiók aktív</label><div class="account-editor-actions"><button type="button" id="account-cancel" class="settings-secondary">Mégse</button><button type="submit" class="settings-primary">Mentés</button></div><div id="account-form-error" role="alert"></div></form></div>
</div>
